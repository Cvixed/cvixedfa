<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F0FDFA" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Monogram "C" -->
  <path d="M310 148c-75-45-168-15-192 72s12 178 100 198c30 7 62 3 92-14" 
        stroke="url(#accent)" stroke-width="52" stroke-linecap="round" fill="none"/>
  <!-- Small chart bars accent -->
  <rect x="320" y="280" width="28" height="80" rx="6" fill="#FFFFFF" opacity="0.6"/>
  <rect x="358" y="240" width="28" height="120" rx="6" fill="#FFFFFF" opacity="0.75"/>
  <rect x="396" y="200" width="28" height="160" rx="6" fill="#FFFFFF" opacity="0.9"/>
